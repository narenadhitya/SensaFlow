<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SensaFlow dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F14}
a{color:#06B6D4}a:hover{color:#67E8F9}
.sf-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.sf-h2{font-family:'IBM Plex Sans',system-ui,sans-serif;font-weight:600;font-size:12px;letter-spacing:0.06em;color:#8B98A8;text-transform:uppercase}
.sf-btn{transition:background .15s ease, border-color .15s ease}
.sf-btn:hover{background:#21262D !important}
.sf-btn:focus-visible,.sf-range:focus-visible{outline:2px solid #06B6D4;outline-offset:2px}
@keyframes sfAlarm{0%,100%{box-shadow:inset 0 0 0 2px #EF4444,inset 0 0 50px rgba(239,68,68,.30)}50%{box-shadow:inset 0 0 0 3px #EF4444,inset 0 0 140px rgba(239,68,68,.55)}}
.sf-alarm{animation:sfAlarm 1.1s ease-in-out infinite}
@keyframes sfBlink{50%{opacity:.3}}
.sf-blink{animation:sfBlink 1s steps(2) infinite}
.sf-range{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:4px 0 0}
.sf-range::-webkit-slider-runnable-track{height:4px;background:#30363D}
.sf-range::-moz-range-track{height:4px;background:#30363D}
.sf-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-9px;background:#E6EDF3;border:2px solid #0D1117}
.sf-range::-moz-range-thumb{width:12px;height:20px;background:#E6EDF3;border:2px solid #0D1117;border-radius:0}
.sf-scroll{scrollbar-width:thin;scrollbar-color:#30363D transparent}
@media (prefers-reduced-motion: reduce){.sf-alarm,.sf-blink{animation:none}}

<body>
<div id="root"></div>
<script>
const { html, render, Component } = htmPreact;
// ---------- equipment profiles: one per sensor domain (geometry, sensors, failure modes) ----------
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const PROFILES = {
  ai4i: {
    subtitle: 'Industrial fault detection · CNC spindle thermal twin',
    trainedOn: 'Trained on: AI4I 2020',
    gaugeTitle: 'FAULT PROBABILITY',
    speeds: [1, 2, 4],
    TYPE_NAME: { HDF: 'Heat dissipation failure', PWF: 'Power failure', OSF: 'Overstrain failure', TWF: 'Tool wear failure' },
    PART_OF: { HDF: 'housing', PWF: 'motor', OSF: 'spindle', TWF: 'tool' },
    PART_NAME: { housing: 'spindle head', motor: 'motor', spindle: 'spindle', tool: 'cutting tool' },
    DRIVERS: { HDF: ['delta', 'rpm', 'proc'], PWF: ['power', 'torque', 'rpm'], OSF: ['strain', 'torque', 'wear'], TWF: ['wear', 'strain'] },
    F: {
      air: { name: 'air_temp', label: 'AIR TEMP', unit: 'K', d: 1 },
      proc: { name: 'process_temp', label: 'PROCESS TEMP', unit: 'K', d: 1 },
      delta: { name: 'temp_delta', label: 'TEMP DELTA', unit: 'K', d: 2 },
      rpm: { name: 'rpm', label: 'SPINDLE SPEED', unit: 'rpm', d: 0 },
      torque: { name: 'torque', label: 'TORQUE', unit: 'Nm', d: 1 },
      power: { name: 'power', label: 'POWER', unit: 'kW', d: 2, scale: 0.001 },
      wear: { name: 'tool_wear', label: 'TOOL WEAR', unit: 'min', d: 0 },
      strain: { name: 'torque×wear', label: 'STRAIN', unit: '', d: 0 },
    },
    sensorKeys: ['air', 'proc', 'delta', 'rpm', 'torque', 'power', 'wear'],
    modeCodes: ['HDF', 'PWF', 'OSF', 'TWF'],
    modeNote: 'RNF (random failure) has no part signature and is not localised on the model.',
    ANCH: [[0, 2.95, 0.3], [0, 1.85, 0.55], [0, 0.7, 0.2], [0, -0.38, 0.05]],
    target: [0, 0.85, 0], orbitR: 10, spinPos: [0, 0, 0],
    spinRate: (row) => (row.rpm / 60) * Math.PI * 2 * 0.06,
    heats(row) {
      const n = (v, a, b) => clamp01((v - a) / (b - a));
      return {
        amb: 0.1 + 0.22 * n(row.air, 297, 306),
        housing: 0.5 * n(row.proc, 306, 314) + 0.55 * n(10.6 - row.delta, 0, 2.6),
        motor: n(row.power, 5200, 13500),
        spindle: 0.75 * n(row.strain, 1500, 11500) + 0.25 * n(row.rpm, 1350, 2100),
        tool: n(row.wear, 20, 250),
      };
    },
    hotspots: (c) => [[0, 2.8, 0, 0.5, c.motor], [0, 1.8, 0, 0.68, c.housing], [0, 0.68, 0, 0.42, c.spindle], [0, -0.42, 0, 0.3, c.tool], [0, -0.66, 0, 0.33, c.tool * 0.5]],
    parts: (row, h, fmt) => [
      { key: 'motor', name: 'MOTOR', code: 'PWF', side: 'right', sig: fmt('power', row.power) + ' kW · ' + fmt('rpm', row.rpm) + ' rpm', heat: h.motor },
      { key: 'housing', name: 'SPINDLE HEAD', code: 'HDF', side: 'left', sig: fmt('proc', row.proc) + ' K · Δ ' + fmt('delta', row.delta) + ' K', heat: Math.min(1, h.housing) },
      { key: 'spindle', name: 'SPINDLE', code: 'OSF', side: 'right', sig: fmt('torque', row.torque) + ' Nm · strain ' + fmt('strain', row.strain), heat: Math.min(1, h.spindle) },
      { key: 'tool', name: 'CUTTING TOOL', code: 'TWF', side: 'left', sig: 'wear ' + fmt('wear', row.wear) + ' min', heat: h.tool },
    ],
    badge: (row, fmt) => ({ value: fmt('rpm', row.rpm), unit: 'RPM' }),
    build(add, THREE, spin) {
      // frame: base, table, workpiece, column, ram
      add(new THREE.BoxGeometry(4.2, 0.3, 3.0, 10, 2, 8), 'frame', 0, -1.45, -0.3, null, 0, 20);
      add(new THREE.BoxGeometry(2.6, 0.2, 1.8, 8, 1, 6), 'frame', 0, -1.2, 0.2, null, 0, 20);
      add(new THREE.BoxGeometry(1.2, 0.45, 0.9, 8, 3, 6), 'frame', 0, -0.875, 0.05, null, 0, 20);
      add(new THREE.BoxGeometry(1.0, 4.8, 0.8, 4, 20, 4), 'frame', 0, 0.85, -1.35, null, 0, 20);
      add(new THREE.BoxGeometry(0.7, 0.6, 0.9, 4, 4, 6), 'frame', 0, 1.85, -0.85, null, 0, 20);
      // spindle head housing (HDF)
      add(new THREE.BoxGeometry(1.3, 1.0, 1.1, 10, 8, 10), 'housing', 0, 1.8, 0, null, 0, 20);
      add(new THREE.CylinderGeometry(0.36, 0.38, 0.22, 48, 2), 'housing', 0, 1.19, 0, null, 0, 20);
      // motor (PWF) with cooling fins
      add(new THREE.CylinderGeometry(0.5, 0.5, 0.95, 48, 14), 'motor', 0, 2.8, 0, null, 0, 20);
      add(new THREE.CylinderGeometry(0.3, 0.42, 0.18, 48, 2), 'motor', 0, 3.365, 0, null, 0, 20);
      for (let i = 0; i < 6; i++) add(new THREE.TorusGeometry(0.53, 0.032, 6, 48), 'motor', 0, 2.44 + i * 0.145, 0, null, Math.PI / 2, 0);
      // rotating spindle (OSF) + holder + tool (TWF)
      add(new THREE.CylinderGeometry(0.26, 0.26, 0.8, 48, 12), 'spindle', 0, 0.68, 0, spin, 0, 20);
      add(new THREE.CylinderGeometry(0.24, 0.12, 0.3, 48, 4), 'spindle', 0, 0.13, 0, spin, 0, 20);
      add(new THREE.CylinderGeometry(0.07, 0.06, 0.62, 24, 12), 'tool', 0, -0.31, 0, spin, 0, 20);
      const pts = [];
      for (let i = 0; i <= 160; i++) { const u = i / 160, a = u * Math.PI * 7; pts.push(new THREE.Vector3(Math.cos(a) * 0.07, -0.6 + u * 0.48, Math.sin(a) * 0.07)); }
      add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 220, 0.022, 6, false), 'tool', 0, 0, 0, spin, 0, 0);
    },
  },

  skab: {
    subtitle: 'Anomaly detection · water-circulation testbed twin (SKAB)',
    trainedOn: 'Baseline: first 400 s of each run (unsupervised)',
    gaugeTitle: 'ANOMALY SCORE (CALIBRATED)',
    speeds: [5, 20, 60],
    TYPE_NAME: { VIB: 'Pump vibration anomaly', ELEC: 'Motor electrical anomaly', FLOW: 'Valve / flow anomaly', TEMP: 'Thermal anomaly' },
    PART_OF: { VIB: 'pump', ELEC: 'motor', FLOW: 'valve', TEMP: 'tank' },
    PART_NAME: { pump: 'pump', motor: 'motor', valve: 'valve', tank: 'fluid loop' },
    DRIVERS: { VIB: ['acc1', 'acc2'], ELEC: ['current', 'voltage'], FLOW: ['flow', 'pressure'], TEMP: ['thermo', 'temp'] },
    F: {
      acc1: { name: 'Accelerometer1RMS', label: 'ACCEL 1 RMS', unit: 'g', d: 4 },
      acc2: { name: 'Accelerometer2RMS', label: 'ACCEL 2 RMS', unit: 'g', d: 4 },
      current: { name: 'Current', label: 'MOTOR CURRENT', unit: 'A', d: 3 },
      voltage: { name: 'Voltage', label: 'VOLTAGE', unit: 'V', d: 1 },
      pressure: { name: 'Pressure', label: 'PRESSURE', unit: 'bar', d: 3 },
      flow: { name: 'Volume Flow RateRMS', label: 'FLOW RATE', unit: 'L/min', d: 2 },
      temp: { name: 'Temperature', label: 'MOTOR TEMP', unit: '°C', d: 2 },
      thermo: { name: 'Thermocouple', label: 'FLUID TEMP', unit: '°C', d: 2 },
    },
    sensorKeys: ['acc1', 'acc2', 'current', 'voltage', 'pressure', 'flow', 'temp', 'thermo'],
    modeCodes: ['VIB', 'ELEC', 'FLOW', 'TEMP'],
    modeNote: 'SKAB has no failure sub-types: the mode is the sensor group that drives the anomaly score (SHAP).',
    ANCH: [[-1.2, 0.35, 0.45], [-1.2, -1.0, 0.6], [1.1, 1.75, 0.3], [2.0, -0.2, 0.62]],
    target: [0.4, 0.1, 0], orbitR: 10.5, spinPos: [-1.2, 0, 0],
    spinRate: () => Math.PI * 2 * 0.8,
    heats(row, z) {
      const m = (...ks) => Math.max(...ks.map((k) => Math.abs(z(k)) || 0));
      const n = (v) => clamp01((v - 0.5) / 3.5);
      return { amb: 0.1, motor: n(m('current', 'voltage')), pump: n(m('acc1', 'acc2')), valve: n(m('pressure', 'flow')), tank: n(m('temp', 'thermo')) };
    },
    hotspots: (c) => [[-1.2, 0.0, 0, 0.55, c.motor], [-1.2, -1.0, 0, 0.5, c.pump], [1.1, 1.4, 0, 0.45, c.valve], [2.0, -0.5, 0, 0.65, c.tank]],
    parts: (row, h, fmt) => [
      { key: 'motor', name: 'MOTOR', code: 'ELEC', side: 'left', sig: fmt('current', row.current) + ' A · ' + fmt('voltage', row.voltage) + ' V', heat: h.motor },
      { key: 'pump', name: 'PUMP', code: 'VIB', side: 'left', sig: 'acc ' + fmt('acc1', row.acc1) + ' / ' + fmt('acc2', row.acc2) + ' g', heat: h.pump },
      { key: 'valve', name: 'VALVE', code: 'FLOW', side: 'right', sig: fmt('flow', row.flow) + ' L/min · ' + fmt('pressure', row.pressure) + ' bar', heat: h.valve },
      { key: 'tank', name: 'FLUID LOOP', code: 'TEMP', side: 'right', sig: fmt('thermo', row.thermo) + ' °C fluid · ' + fmt('temp', row.temp) + ' °C', heat: h.tank },
    ],
    badge: (row, fmt) => ({ value: fmt('flow', row.flow), unit: 'L/MIN' }),
    build(add, THREE, spin) {
      const H = Math.PI / 2;
      add(new THREE.BoxGeometry(5.0, 0.2, 2.4, 12, 1, 6), 'frame', 0.4, -1.6, 0, null, 0, 20);
      // vertical inline pump (VIB) with motor (ELEC) on top
      add(new THREE.CylinderGeometry(0.55, 0.55, 0.6, 48, 4), 'pump', -1.2, -1.0, 0, null, 0, 20);
      add(new THREE.CylinderGeometry(0.16, 0.16, 0.5, 24, 2), 'pump', -0.7, -1.0, 0, null, 0, 20, 0, H);
      add(new THREE.CylinderGeometry(0.3, 0.42, 0.35, 48, 2), 'pump', -1.2, -0.55, 0, null, 0, 20);
      add(new THREE.CylinderGeometry(0.45, 0.45, 1.0, 48, 10), 'motor', -1.2, 0.0, 0, null, 0, 20);
      for (let i = 0; i < 6; i++) add(new THREE.TorusGeometry(0.48, 0.03, 6, 48), 'motor', -1.2, -0.35 + i * 0.14, 0, null, H, 0);
      add(new THREE.CylinderGeometry(0.32, 0.45, 0.15, 48, 2), 'motor', -1.2, 0.575, 0, null, 0, 20);
      // rotating cooling fan on the motor
      add(new THREE.CylinderGeometry(0.12, 0.12, 0.12, 24, 1), 'motor', 0, 0.71, 0, spin, 0, 20);
      for (let k = 0; k < 4; k++) add(new THREE.BoxGeometry(0.6, 0.03, 0.09, 4, 1, 1), 'motor', 0, 0.7, 0, spin, 0, 20, k * Math.PI / 4);
      // pipe loop
      add(new THREE.CylinderGeometry(0.12, 0.12, 0.65, 24, 2), 'frame', -0.125, -1.0, 0, null, 0, 20, 0, H);
      add(new THREE.CylinderGeometry(0.12, 0.12, 2.4, 24, 8), 'frame', 0.2, 0.2, 0, null, 0, 20);
      add(new THREE.CylinderGeometry(0.12, 0.12, 1.8, 24, 8), 'frame', 1.1, 1.4, 0, null, 0, 20, 0, H);
      add(new THREE.CylinderGeometry(0.12, 0.12, 1.2, 24, 4), 'frame', 2.0, 0.8, 0, null, 0, 20);
      add(new THREE.CylinderGeometry(0.08, 0.08, 3.2, 24, 10), 'frame', 0.4, -1.38, 0.5, null, 0, 20, 0, H);
      // control valve (FLOW): body, flanges, stem, handwheel
      add(new THREE.BoxGeometry(0.45, 0.5, 0.5, 4, 4, 4), 'valve', 1.1, 1.4, 0, null, 0, 20);
      add(new THREE.CylinderGeometry(0.2, 0.2, 0.08, 32, 1), 'valve', 0.84, 1.4, 0, null, 0, 20, 0, H);
      add(new THREE.CylinderGeometry(0.2, 0.2, 0.08, 32, 1), 'valve', 1.36, 1.4, 0, null, 0, 20, 0, H);
      add(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 16, 2), 'valve', 1.1, 1.85, 0, null, 0, 20);
      add(new THREE.TorusGeometry(0.25, 0.035, 8, 40), 'valve', 1.1, 2.05, 0, null, H, 0);
      // tank / fluid loop (TEMP)
      add(new THREE.CylinderGeometry(0.6, 0.6, 1.4, 48, 10), 'tank', 2.0, -0.5, 0, null, 0, 20);
      add(new THREE.CylinderGeometry(0.62, 0.62, 0.06, 48, 1), 'tank', 2.0, 0.22, 0, null, 0, 20);
    },
  },
};


class App extends Component {
  constructor(props) {
    super(props);
    this.state = { t: 0, playing: true, speed: (PROFILES[window.SF.profile] || PROFILES.ai4i).speeds[0], filter: 'ALL', anchors: null, vw: 0, vh: 0, ready: false, glError: false };
  }

  SEVC = { HIGH: '#EF4444', MED: '#F59E0B', NONE: '#10B981' };
  get P() { return PROFILES[window.SF.profile] || PROFILES.ai4i; }
  get TYPE_NAME() { return this.P.TYPE_NAME; }
  get PART_OF() { return this.P.PART_OF; }
  get PART_NAME() { return this.P.PART_NAME; }
  get DRIVERS() { return this.P.DRIVERS; }
  get F() { return this.P.F; }
  get ANCH() { return this.P.ANCH; }
  RAMP = [[0, [0.17, 0.27, 0.55]], [0.3, [0.03, 0.57, 0.70]], [0.55, [0.98, 0.80, 0.08]], [0.78, [0.98, 0.45, 0.09]], [0.92, [0.86, 0.15, 0.15]], [1, [1, 0.92, 0.82]]];

  // ---------- real pipeline output (outputs/scored_data.csv, injected by dashboard/app.py) ----------
  data() {
    if (this._data) return this._data;
    const cols = window.SF.columns;
    const rows = window.SF.rows.map((r, t) => {
      const o = { t };
      cols.forEach((c, j) => { o[c] = r[j]; });
      return o;
    });
    const S = {};
    Object.keys(this.F).forEach((key) => {
      const norm = rows.filter((x) => x.prob < 0.3).map((x) => x[key]);
      const m = norm.reduce((a, b) => a + b, 0) / norm.length;
      const s = Math.sqrt(norm.reduce((a, b) => a + (b - m) * (b - m), 0) / norm.length) || 1;
      const all = rows.map((x) => x[key]);
      S[key] = { m, s, lo: Math.min(...all), hi: Math.max(...all) };
    });
    this._stats = S;
    this._data = rows;
    return rows;
  }

  z(key, row) { const s = this._stats[key]; return (row[key] - s.m) / s.s; }
  fmt(key, v) { const f = this.F[key]; return (v * (f.scale || 1)).toFixed(f.d); }
  sevOf(p, hi, med) { return p >= hi ? 'HIGH' : p >= med ? 'MED' : 'NONE'; }
  tm(i) { const l = window.SF.meta.idLabel; return (l ? l + ' ' : '') + this.data()[i].uid; }
  evidence(row, type) {
    if (row.ev1) return [row.ev1, row.ev2].filter(Boolean);   // SHAP drivers from the pipeline
    if (!type) return [];
    return this.DRIVERS[type].map((k) => ({ k, z: this.z(k, row) }))
      .sort((a, b) => Math.abs(b.z) - Math.abs(a.z)).slice(0, 2)
      .map((d) => this.F[d.k].name + ' ' + this.fmt(d.k, row[d.k]) + (this.F[d.k].unit ? ' ' + this.F[d.k].unit : '') + ' (' + (d.z >= 0 ? '+' : '') + d.z.toFixed(1) + 'σ)');
  }
  heats(row) { return this.P.heats(row, (k) => this.z(k, row)); }
  ramp(h, out) {
    const R = this.RAMP;
    for (let i = 1; i < R.length; i++) {
      if (h <= R[i][0]) {
        const a = R[i - 1], b = R[i], u = (h - a[0]) / (b[0] - a[0]);
        out[0] = a[1][0] + (b[1][0] - a[1][0]) * u; out[1] = a[1][1] + (b[1][1] - a[1][1]) * u; out[2] = a[1][2] + (b[1][2] - a[1][2]) * u;
        return out;
      }
    }
    out[0] = 1; out[1] = 0.92; out[2] = 0.82; return out;
  }
  hex(h) { const c = this.ramp(Math.max(0, Math.min(1, h)), [0, 0, 0]); return '#' + c.map((v) => Math.round(v * 255).toString(16).padStart(2, '0')).join(''); }
  alerts(hi, med) {
    const key = hi + '|' + med;
    if (this._ak === key) return this._al;
    const out = []; let cur = null;
    this.data().forEach((r, i) => {
      if (r.prob >= med) {
        if (!cur) cur = { start: i, end: i, peak: r.prob, peakT: i, type: r.type };
        cur.end = i;
        if (r.prob > cur.peak) { cur.peak = r.prob; cur.peakT = i; if (r.type) cur.type = r.type; }
      } else if (cur) { out.push(cur); cur = null; }
    });
    if (cur) out.push(cur);
    out.forEach((a) => { a.sev = a.peak >= hi ? 'HIGH' : 'MED'; });
    this._ak = key; this._al = out;
    return out;
  }
  thresholds() {
    const hi = this.props.highThreshold ?? 0.8;
    return { hi, med: Math.min(this.props.medThreshold ?? 0.5, hi - 0.01) };
  }

  // ---------- lifecycle ----------
  componentDidMount() {
    this._onResize = () => this.forceUpdate();
    window.addEventListener('resize', this._onResize);
    const { hi, med } = this.thresholds();
    const first = this.alerts(hi, med)[0];
    if (first) this.setState({ t: Math.max(0, first.start - 18) });
    this.timer = setInterval(() => {
      if (!this.state.playing) return;
      this.setState({ t: (this.state.t + this.state.speed) % this.data().length });
    }, 140);
    this.tryInit();
  }
  componentWillUnmount() {
    this.dead = true;
    window.removeEventListener('resize', this._onResize);
    clearInterval(this.timer); clearTimeout(this._wait); cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
    if (this.renderer) this.renderer.dispose();
  }

  tryInit() {
    if (this.renderer || !this.canvasEl || this.dead) return;
    const THREE = window.THREE;
    if (!THREE) { this._tries = (this._tries || 0) + 1; if (this._tries > 50) { this.setState({ glError: true }); return; } this._wait = setTimeout(() => this.tryInit(), 200); return; }
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: this.canvasEl, antialias: true, alpha: true }); }
    catch (e) { this.setState({ glError: true }); return; }
    this.renderer = renderer;
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setClearColor(0x000000, 0);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
    this.camera = camera;
    scene.add(new THREE.AmbientLight(0xffffff, 0.62));
    const d1 = new THREE.DirectionalLight(0xffffff, 0.7); d1.position.set(4, 6, 5); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0x9fdcff, 0.3); d2.position.set(-5, 2, -4); scene.add(d2);
    const grid = new THREE.GridHelper(12, 24, 0x2a3442, 0x182029); grid.position.y = -1.61; scene.add(grid);

    const spin = new THREE.Group(); scene.add(spin); this.spin = spin;
    const meshes = []; this.meshes = meshes;
    const add = (geo, part, x, y, z, parent, rx, edgeAngle, ry, rz) => {
      geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));
      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
      mesh.position.set(x, y, z); if (rx) mesh.rotation.x = rx; if (ry) mesh.rotation.y = ry; if (rz) mesh.rotation.z = rz;
      (parent || scene).add(mesh);
      const em = new THREE.LineBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.25 });
      let lines = null;
      if (edgeAngle) { lines = new THREE.LineSegments(new THREE.EdgesGeometry(geo, edgeAngle), em); mesh.add(lines); }
      meshes.push({ mesh, part, lines, em });
    };
    spin.position.set(...this.P.spinPos);
    this.P.build(add, THREE, spin);

    scene.updateMatrixWorld(true);
    const v = new THREE.Vector3();
    meshes.forEach((m) => {
      const p = m.mesh.geometry.attributes.position, wp = new Float32Array(p.count * 3);
      for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(m.mesh.matrixWorld); wp[i * 3] = v.x; wp[i * 3 + 1] = v.y; wp[i * 3 + 2] = v.z; }
      m.wp = wp;
    });

    this.orb = { th: 0.65, ph: 1.2, r: this.P.orbitR };
    const cv = this.canvasEl;
    cv.addEventListener('pointerdown', (e) => { this.drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
    cv.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      this.orb.th -= (e.clientX - this.drag.x) * 0.008;
      this.orb.ph = Math.max(0.35, Math.min(1.52, this.orb.ph - (e.clientY - this.drag.y) * 0.008));
      this.drag = { x: e.clientX, y: e.clientY };
    });
    const end = () => { this.drag = null; cv.style.cursor = 'grab'; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('wheel', (e) => { e.preventDefault(); this.orb.r = Math.max(6, Math.min(16, this.orb.r * (e.deltaY > 0 ? 1.08 : 0.93))); }, { passive: false });

    const resize = () => {
      const el = cv.parentElement; if (!el) return;
      const w = el.clientWidth, h = el.clientHeight; if (!w || !h) return;
      this.vw = w; this.vh = h;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      this._tagKey = null;
    };
    this.ro = new ResizeObserver(resize); this.ro.observe(cv.parentElement); resize();

    this.cur = this.heats(this.data()[this.state.t]);
    const col = [0, 0, 0], pv = new THREE.Vector3();
    const loop = (now) => {
      if (this.dead) return;
      this.raf = requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - (this._last || now)) / 1000); this._last = now;
      const row = this.data()[this.state.t];
      const { hi, med } = this.thresholds();
      const sev = this.sevOf(row.prob, hi, med);
      const impl = sev !== 'NONE' && row.type ? this.PART_OF[row.type] : null;
      const tgt = this.heats(row), cur = this.cur, kk = Math.min(1, dt * 5);
      for (const key in tgt) cur[key] += (tgt[key] - cur[key]) * kk;
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.0065);

      spin.rotation.y += this.P.spinRate(row) * dt;
      if ((this.props.autoRotate ?? true) && !this.drag) this.orb.th += dt * 0.12;
      const o = this.orb;
      const tg = this.P.target;
      camera.position.set(tg[0] + o.r * Math.sin(o.ph) * Math.sin(o.th), tg[1] + o.r * Math.cos(o.ph), tg[2] + o.r * Math.sin(o.ph) * Math.cos(o.th));
      camera.lookAt(tg[0], tg[1], tg[2]);

      const HS = this.P.hotspots(cur), NH = HS.length;
      const wire = this.props.wireframe ?? true;
      meshes.forEach((m) => {
        const wp = m.wp, ca = m.mesh.geometry.attributes.color, c = ca.array;
        const tintAmber = sev === 'MED' && m.part === impl ? 0.18 + 0.22 * pulse : 0;
        const red = sev === 'HIGH' ? 0.68 + 0.2 * pulse : 0;
        for (let i = 0, n = wp.length; i < n; i += 3) {
          const x = wp[i], y = wp[i + 1], zz = wp[i + 2];
          let s = cur.amb;
          for (let j = 0; j < NH; j++) {
            const q = HS[j], dx = x - q[0], dy = y - q[1], dz = zz - q[2], sg = q[3];
            s += q[4] * Math.exp(-(dx * dx + dy * dy + dz * dz) / (2 * sg * sg));
          }
          const h = s > 1 ? 1 : s;
          this.ramp(h, col);
          if (tintAmber) { col[0] += (0.96 - col[0]) * tintAmber; col[1] += (0.62 - col[1]) * tintAmber; col[2] += (0.04 - col[2]) * tintAmber; }
          if (red) { const b = 0.5 + 0.5 * h; col[0] += (0.98 * b - col[0]) * red; col[1] += (0.12 * b - col[1]) * red; col[2] += (0.1 * b - col[2]) * red; }
          c[i] = col[0]; c[i + 1] = col[1]; c[i + 2] = col[2];
        }
        ca.needsUpdate = true;
        m.mesh.material.emissive.setRGB(sev === 'HIGH' ? 0.18 * pulse : 0, 0, 0);
        if (m.lines) {
          let hexc = 0x06b6d4, op = 0.22;
          if (sev === 'HIGH') { hexc = 0xff5a52; op = m.part === impl ? 0.55 + 0.45 * pulse : 0.5; }
          else if (sev === 'MED' && m.part === impl) { hexc = 0xf59e0b; op = 0.45 + 0.5 * pulse; }
          m.em.color.setHex(hexc); m.em.opacity = op;
          m.lines.visible = wire || (sev !== 'NONE' && (sev === 'HIGH' || m.part === impl));
        }
      });
      renderer.render(scene, camera);

      if (this.vw && now - (this._tagT || 0) > 70) {
        this._tagT = now;
        const pos = this.ANCH.map((a) => { pv.set(a[0], a[1], a[2]).project(camera); return { x: (pv.x + 1) / 2 * this.vw, y: (1 - pv.y) / 2 * this.vh }; });
        const key = pos.map((p) => Math.round(p.x) + ',' + Math.round(p.y)).join('|') + '|' + this.vw + 'x' + this.vh;
        if (key !== this._tagKey) { this._tagKey = key; this.setState({ anchors: pos, vw: this.vw, vh: this.vh, ready: true }); }
      }
    };
    this.raf = requestAnimationFrame(loop);
  }

  // ---------- view model ----------
  renderVals() {
    if (!this._setCanvas) this._setCanvas = (el) => { if (el && el !== this.canvasEl) { this.canvasEl = el; this.tryInit(); } };
    const D = this.data(), S = this._stats, N = D.length, META = window.SF.meta;
    const { hi, med } = this.thresholds();
    const t = Math.max(0, Math.min(N - 1, this.state.t | 0));
    const row = D[t];
    const sev = this.sevOf(row.prob, hi, med);
    const ft = sev !== 'NONE' ? row.type : null;
    const sc = this.SEVC[sev];
    const all = this.alerts(hi, med);

    // sensors
    const sensors = this.P.sensorKeys.map((k) => {
      const z = this.z(k, row), az = Math.abs(z);
      const lo = S[k].lo, span = (S[k].hi - lo) || 1;
      let d = '';
      for (let i = Math.max(0, t - 59), j = 0; i <= t; i++, j++) {
        const x = (j / 59) * 92, y = 26 - ((D[i][k] - lo) / span) * 24;
        d += (j ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      const zc = az >= 3 ? '#EF4444' : az >= 2 ? '#F59E0B' : '#8B949E';
      return { label: this.F[k].label, val: this.fmt(k, row[k]), unit: this.F[k].unit, zTxt: (z >= 0 ? '+' : '') + z.toFixed(1) + 'σ', zColor: zc, spark: d, stroke: az >= 2 ? zc : '#06B6D4' };
    });

    // gauge
    const tick = (p) => { const a = Math.PI - Math.PI * p, c = Math.cos(a), s = Math.sin(a); return { x1: 100 + 66 * c, y1: 100 - 66 * s, x2: 100 + 93 * c, y2: 100 - 93 * s }; };
    const L = Math.PI * 80;

    // callouts on the model
    const h = this.heats(row);
    const PARTS = this.P.parts(row, h, (k, v) => this.fmt(k, v));
    const A = this.state.anchors, vw = this.state.vw || 800, vh = this.state.vh || 660;
    const ev = this.evidence(row, ft);
    const tags = [];
    let leadCool = '', leadHot = '';
    if (A && (this.props.showCallouts ?? true)) {
      PARTS.forEach((p, i) => {
        const a = A[i]; if (!a) return;
        const W = 184, hot = !!ft && this.PART_OF[ft] === p.key;
        let lx = p.side === 'left' ? a.x - W - 64 : a.x + 64;
        lx = Math.max(8, Math.min(vw - W - 8, lx));
        const ly = Math.max(56, Math.min(vh - (hot ? 140 : 84), a.y - 26));
        const x2 = p.side === 'left' ? lx + W : lx, y2 = ly + 14;
        const seg = 'M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + 'L' + x2.toFixed(1) + ' ' + y2.toFixed(1);
        if (hot) leadHot += seg; else leadCool += seg;
        tags.push({
          dx: a.x - 4.5, dy: a.y - 4.5, lx, ly, name: p.name, code: p.code, sig: p.sig,
          heatPct: Math.round(p.heat * 100), heatHex: this.hex(p.heat),
          hot, border: hot ? sc : '#30363D', codeColor: hot ? sc : '#6E7681',
          sevLine: sev + ' · p=' + row.prob.toFixed(2), ev1: ev[0] || '', ev2: ev[1] || '',
        });
      });
    }

    // alert feed (only what the replay has reached)
    const filter = this.state.filter;
    const revealed = all.filter((a) => a.start <= t);
    const feed = revealed.slice().reverse().map((a) => {
      let peak = a.peak, pt = a.peakT;
      if (a.end > t) { peak = 0; for (let i = a.start; i <= t; i++) if (D[i].prob > peak) { peak = D[i].prob; pt = i; } }
      const s = peak >= hi ? 'HIGH' : 'MED';
      const live = t >= a.start && t <= a.end;
      const e = this.evidence(D[pt], a.type);
      const truth = D[pt].actual === 1 ? '  ✓ confirmed' : D[pt].actual === 0 ? '  ✗ false alarm' : '';
      return {
        sev: s, color: this.SEVC[s], time: a.end > a.start ? this.tm(a.start) + '–' + D[Math.min(a.end, t)].uid : this.tm(a.start), conf: (peak * 100).toFixed(1) + '%',
        typeName: this.TYPE_NAME[a.type] || 'Unclassified', live: live ? '  ● ACTIVE' : '', truth, ev: e[0] || '',
        bg: live ? (s === 'HIGH' ? 'rgba(239,68,68,0.12)' : 'rgba(245,158,11,0.10)') : 'rgba(255,255,255,0.02)',
        border: live ? this.SEVC[s] : 'rgba(255,255,255,0.06)',
        pick: () => this.setState({ t: pt, playing: false }),
      };
    }).filter((a) => filter === 'ALL' || a.sev === filter);

    const modes = this.P.modeCodes.map((code) => {
      const active = ft === code;
      return {
        code, name: this.TYPE_NAME[code].replace(/ (failure|anomaly)$/, ''), part: this.PART_NAME[this.PART_OF[code]],
        count: revealed.filter((a) => a.type === code).length,
        state: active ? sev : 'OK', color: active ? sc : '#10B981',
        border: active ? sc : 'rgba(255,255,255,0.05)', bg: active ? (sev === 'HIGH' ? 'rgba(239,68,68,0.12)' : 'rgba(245,158,11,0.10)') : 'transparent',
      };
    });

    // timeline
    const X = (i) => (i / (N - 1)) * 1000, Y = (p) => 116 - p * 110;
    if (!this._probLine) {
      let d = '';
      D.forEach((r, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(r.prob).toFixed(1); });
      this._probLine = d; this._probArea = d + 'L1000 120L0 120Z';
    }
    let zoneHigh = '', zoneMed = '';
    all.forEach((a) => {
      const x0 = X(a.start), x1 = Math.max(X(a.end + 1), x0 + 2);   // keep single-row alerts visible
      const z = 'M' + x0.toFixed(1) + ' 0H' + x1.toFixed(1) + 'V120H' + x0.toFixed(1) + 'Z';
      if (a.sev === 'HIGH') zoneHigh += z; else zoneMed += z;
    });
    const axis = [0, 0.25, 0.5, 0.75, 1].map((f) => this.tm(Math.round(f * (N - 1))));

    const pick = (k, v) => () => this.setState({ [k]: v });
    return {
      setCanvas: this._setCanvas,
      clock: this.tm(t),
      statusLabel: sev === 'HIGH' ? 'FAULT' : sev === 'MED' ? 'WARNING' : 'NORMAL',
      statusColor: sc, statusBlink: sev === 'HIGH' ? 'sf-blink' : '',
      sevLabel: sev === 'NONE' ? 'NO ALERT' : sev + ' SEVERITY',
      alertCount: revealed.length, highCount: revealed.filter((a) => a.sev === 'HIGH').length,
      tShown: t + 1, N,
      model: META.model, f1: META.f1, source: META.source,
      probPct: (row.prob * 100).toFixed(1) + '%',
      gaugeColor: sev === 'NONE' ? '#06B6D4' : sc,
      gaugeDash: (row.prob * L).toFixed(1) + ' ' + L.toFixed(1),
      medTick: tick(med), hiTick: tick(hi), medTxt: med.toFixed(2), hiTxt: hi.toFixed(2),
      sensors,
      vpBorder: sev === 'NONE' ? 'rgba(255,255,255,0.06)' : sc,
      vpGlow: sev === 'MED' ? 'inset 0 0 0 2px #F59E0B, inset 0 0 60px rgba(245,158,11,0.18)' : 'none',
      alarmClass: sev === 'HIGH' ? 'sf-alarm' : '',
      tags, leadCool, leadHot, leadHotColor: sc,
      hasBanner: sev !== 'NONE',
      bannerBg: sc,
      bannerText: (sev === 'HIGH' ? 'FAULT' : 'WARNING') + ' · ' + (ft ? this.TYPE_NAME[ft].toUpperCase() + ' · ' + this.PART_NAME[this.PART_OF[ft]].toUpperCase() : 'UNCLASSIFIED') + ' · p=' + row.prob.toFixed(2),
      loading: !this.state.ready,
      loadingText: this.state.glError ? 'WebGL unavailable: the 3D view could not start in this browser.' : 'Loading 3D model…',
      compact: !!this.props.compact || window.innerWidth < 900,
      badge: this.P.badge(row, (k, v) => this.fmt(k, v)),
      subtitle: this.P.subtitle, trainedOn: this.P.trainedOn, gaugeTitle: this.P.gaugeTitle, modeNote: this.P.modeNote,
      filters: ['ALL', 'HIGH', 'MED'].map((f) => ({ label: f, pressed: filter === f, pick: pick('filter', f), bg: filter === f ? '#30363D' : 'transparent', fg: filter === f ? '#E6EDF3' : '#8B949E' })),
      feed, noAlerts: feed.length === 0, modes,
      playing: this.state.playing, paused: !this.state.playing,
      playLabel: this.state.playing ? 'Pause replay' : 'Play replay',
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      speeds: this.P.speeds.map((s) => ({ label: s + '×', pressed: this.state.speed === s, pick: pick('speed', s), bg: this.state.speed === s ? '#06B6D4' : 'transparent', fg: this.state.speed === s ? '#0D1117' : '#C9D1D9' })),
      nextFault: () => {
        const nx = all.find((a) => a.start > t + 1) || all[0];
        if (nx) this.setState({ t: Math.max(0, nx.start - 18), playing: true });
      },
      tPad: String(t).padStart(4, '0'),
      zoneHigh, zoneMed, medY: Y(med), hiY: Y(hi),
      probLine: this._probLine, probArea: this._probArea,
      cursorX: X(t), futureW: Math.max(0, 1000 - X(t)),
      maxT: N - 1, t, axis,
      onScrub: (e) => this.setState({ t: +e.target.value }),
    };
  }

  render() {
    const v = this.renderVals();
    const mono = "font-family: 'JetBrains Mono', monospace";
    return html`
<div style="box-sizing: border-box; padding: 6px 2px 12px; background: transparent; color: #D6DEE7; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<div style="max-width: 1600px; margin: 0 auto">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06)">
<div style="display: flex; align-items: center; gap: 14px">
${!window.SF.embedded && html`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path><circle cx="12" cy="12" r="6.6"></circle></svg>`}
<div>
${!window.SF.embedded && html`<div class="sf-mono" style="font-size: 18px; font-weight: 700; letter-spacing: 0.16em; color: #E6EDF3">SENSAFLOW</div>`}
<div style=${window.SF.embedded ? "font-size: 15px; font-weight: 600; color: #E6EDF3" : "font-size: 12px; color: #8B949E"}>${v.subtitle}</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<span class="sf-mono" style="font-size: 11px; padding: 6px 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; background: rgba(255,255,255,0.03); color: #8B98A8">${v.source}</span>
<span class="sf-mono" style="font-size: 13px; color: #C9D1D9">${v.clock}</span>
<span class="sf-mono" style=${`display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border: 1px solid ${v.statusColor}; border-radius: 999px; background: color-mix(in srgb, ${v.statusColor} 12%, transparent); color: ${v.statusColor}; font-size: 12px; font-weight: 700; letter-spacing: 0.12em`}><span class=${v.statusBlink} style=${`width: 8px; height: 8px; border-radius: 50%; background: ${v.statusColor}`}></span>${v.statusLabel}</span>
</div>
</header>
<div class="sf-mono" style="font-size: 12px; color: #7D8896; padding: 10px 0 16px; display: flex; flex-wrap: wrap; gap: 6px 22px">
<span><b style="color: #E6EDF3">${v.alertCount}</b> alerts (<b style="color: #EF4444">${v.highCount}</b> HIGH) across <b style="color: #E6EDF3">${v.tShown}</b> / ${v.N} timesteps</span>
<span>Model: ${v.model}</span>

<span>${v.trainedOn}</span>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">

<section aria-label="Sensor readings" style=${`flex: ${v.compact ? "1 1 300px" : "1 1 230px"}; min-width: 0; display: flex; flex-direction: column; gap: 16px`}>
<div style="background: linear-gradient(180deg, #151C26 0%, #121821 100%); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,0.28); padding: 16px 18px 12px">
<h2 class="sf-h2" style="margin: 0 0 4px">${v.gaugeTitle}</h2>
<svg viewBox="0 0 200 118" style="width: 100%; max-width: 250px; display: block; margin: 0 auto" role="img" aria-label=${'Fault probability gauge, ' + v.probPct}>
<path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#21262D" stroke-width="14"></path>
<path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke=${v.gaugeColor} stroke-width="14" stroke-dasharray=${v.gaugeDash}></path>
<line x1=${v.medTick.x1} y1=${v.medTick.y1} x2=${v.medTick.x2} y2=${v.medTick.y2} stroke="#F59E0B" stroke-width="2"></line>
<line x1=${v.hiTick.x1} y1=${v.hiTick.y1} x2=${v.hiTick.x2} y2=${v.hiTick.y2} stroke="#EF4444" stroke-width="2"></line>
<text x="100" y="88" text-anchor="middle" fill="#E6EDF3" style=${mono + '; font-size: 28px; font-weight: 700'}>${v.probPct}</text>
<text x="100" y="106" text-anchor="middle" fill=${v.statusColor} style=${mono + '; font-size: 11px; letter-spacing: 2px'}>${v.sevLabel}</text>
<text x="20" y="116" text-anchor="middle" fill="#8B949E" style=${mono + '; font-size: 9px'}>0</text>
<text x="180" y="116" text-anchor="middle" fill="#8B949E" style=${mono + '; font-size: 9px'}>1</text>
</svg>
<div class="sf-mono" style="display: flex; justify-content: space-between; font-size: 11px; color: #8B949E; margin-top: 6px"><span><span style="color: #F59E0B">■</span> MED ≥ ${v.medTxt}</span><span><span style="color: #EF4444">■</span> HIGH ≥ ${v.hiTxt}</span></div>
</div>
<div style="background: linear-gradient(180deg, #151C26 0%, #121821 100%); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,0.28); padding: 14px 18px 6px; flex: 1 1 auto">
<h2 class="sf-h2" style="margin: 0 0 6px">SENSORS · Z VS NORMAL OPS</h2>
${v.sensors.map((s) => html`
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.05)">
<div style="flex: 1 1 auto; min-width: 0">
<div class="sf-mono" style="font-size: 10px; letter-spacing: 0.12em; color: #8B949E">${s.label}</div>

<span class="sf-mono" style="font-size: 16px; color: #E6EDF3; font-weight: 500">${s.val}</span>
<span class="sf-mono" style="font-size: 11px; color: #8B949E">${s.unit}</span>
<span class="sf-mono" style=${`font-size: 11px; margin-left: auto; color: ${s.zColor}`}>${s.zTxt}</span>

</div>
<svg viewBox="0 0 92 28" preserveAspectRatio="none" style="width: 72px; height: 26px; flex: none" aria-hidden="true"><path d=${s.spark} fill="none" stroke=${s.stroke} stroke-width="1.5"></path></svg>
</div>`)}
</div>
</section>

<section aria-label="3D thermal model" style=${v.compact ? "flex: 1 1 100%; order: -1; min-width: 0" : "flex: 999 1 400px; min-width: 0"}>
<div style=${`position: relative; height: ${v.compact ? 540 : 640}px; background: radial-gradient(120% 90% at 50% 35%, #111823 0%, #0A0E13 70%); border: 1px solid ${v.vpBorder}; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 28px rgba(0,0,0,0.28)`}>
<div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px"></div>
<canvas ref=${v.setCanvas} role="img" aria-label="3D model of the equipment coloured by heat. Drag to orbit, scroll to zoom." style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab"></canvas>
<svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none" aria-hidden="true">
<path d=${v.leadCool} fill="none" stroke="#6E7681" stroke-width="1"></path>
<path d=${v.leadHot} fill="none" stroke=${v.leadHotColor} stroke-width="1.5"></path>
</svg>
${v.tags.map((g) => html`
<div style=${`position: absolute; left: ${g.dx}px; top: ${g.dy}px; width: 9px; height: 9px; border-radius: 50%; background: ${g.heatHex}; border: 2px solid #0D1117; box-shadow: 0 0 0 1px ${g.border}; pointer-events: none`}></div>
<div style=${`position: absolute; left: ${g.lx}px; top: ${g.ly}px; width: 184px; box-sizing: border-box; padding: 8px 10px; background: rgba(14,19,27,0.82); backdrop-filter: blur(6px); border: 1px solid ${g.border}; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.35); pointer-events: none`}>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 6px">
<span class="sf-mono" style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #E6EDF3">${g.name}</span>
<span class="sf-mono" style=${`font-size: 10px; color: ${g.codeColor}`}>${g.code}</span>
</div>
<div class="sf-mono" style="font-size: 11px; color: #C9D1D9; margin-top: 2px">${g.sig}</div>
<div style="display: flex; align-items: center; gap: 6px; margin-top: 5px">
<div style="flex: 1; height: 4px; background: #21262D"><div style=${`height: 4px; width: ${g.heatPct}%; background: ${g.heatHex}`}></div></div>
<span class="sf-mono" style="font-size: 10px; color: #8B949E">HEAT ${g.heatPct}%</span>
</div>
${g.hot && html`
<div style="margin-top: 6px; padding-top: 6px; border-top: 1px solid #30363D">
<div class="sf-mono" style=${`font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: ${g.border}`}>${g.sevLine}</div>
<div class="sf-mono" style="font-size: 10px; color: #E6EDF3; margin-top: 3px">${g.ev1}</div>
<div class="sf-mono" style="font-size: 10px; color: #C9D1D9; margin-top: 2px">${g.ev2}</div>
</div>`}
</div>`)}
<div class=${v.alarmClass} style=${`position: absolute; inset: 0; border-radius: 14px; pointer-events: none; box-shadow: ${v.vpGlow}`}></div>
<div style="position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 5px; pointer-events: none">
<span class="sf-mono" style="font-size: 10px; letter-spacing: 0.14em; color: #8B949E">THERMAL SIGNATURE</span>
<div style="width: 150px; height: 8px; background: linear-gradient(90deg, #2B458C 0%, #0891B3 30%, #FACC14 55%, #FA7317 78%, #DC2626 92%, #FFEBD1 100%)"></div>
<div class="sf-mono" style="display: flex; justify-content: space-between; width: 150px; font-size: 9px; color: #8B949E"><span>COOL</span><span>HOT</span></div>
</div>
${v.hasBanner && html`
<div class="sf-mono" role="status" style=${`position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 200px); padding: 7px 16px; border-radius: 999px; background: ${v.bannerBg}; color: #0D1117; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis`}>${v.bannerText}</div>`}
${v.loading && html`
<div class="sf-mono" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8B949E; pointer-events: none">${v.loadingText}</div>`}
<div class="sf-mono" style="position: absolute; left: 14px; bottom: 12px; font-size: 10px; color: #4F5B69; pointer-events: none">Drag to orbit · scroll to zoom</div>
<div class="sf-mono" style="position: absolute; right: 12px; bottom: 10px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(14,19,27,0.82); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; pointer-events: none">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#06B6D4" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>
<span style="font-size: 13px; color: #E6EDF3; font-weight: 500">${v.badge.value}</span><span style="font-size: 10px; color: #8B949E">${v.badge.unit}</span>
</div>
</div>
</section>

<section aria-label="Alerts and failure modes" style=${`flex: ${v.compact ? "1 1 300px" : "1 1 250px"}; min-width: 0; display: flex; flex-direction: column; gap: 16px`}>
<div style="background: linear-gradient(180deg, #151C26 0%, #121821 100%); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,0.28); padding: 16px 18px; display: flex; flex-direction: column; min-height: 0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px">
<h2 class="sf-h2" style="margin: 0">ALERT FEED</h2>
<div role="group" aria-label="Severity filter" style="display: flex; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden">
${v.filters.map((f) => html`
<button type="button" class="sf-btn sf-mono" aria-pressed=${String(f.pressed)} onClick=${f.pick} style=${`min-height: 30px; padding: 0 10px; border: 0; background: ${f.bg}; color: ${f.fg}; font-size: 11px; font-weight: 600; cursor: pointer`}>${f.label}</button>`)}
</div>
</div>
<div class="sf-scroll" style="max-height: 372px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px">
${v.noAlerts && html`
<div class="sf-mono" style="font-size: 12px; color: #8B949E; padding: 18px 4px">No alerts yet in this replay window.</div>`}
${v.feed.map((a) => html`
<button type="button" class="sf-btn" onClick=${a.pick} style=${`display: block; width: 100%; text-align: left; padding: 10px 12px; background: ${a.bg}; border: 1px solid ${a.border}; border-radius: 10px; color: #C9D1D9; cursor: pointer; font-family: inherit`}>
<span style="display: flex; align-items: center; gap: 8px">
<span style=${`width: 8px; height: 8px; border-radius: 50%; background: ${a.color}; flex: none`}></span>
<span class="sf-mono" style=${`font-size: 11px; font-weight: 700; color: ${a.color}`}>${a.sev}</span>
<span class="sf-mono" style="font-size: 11px; color: #8B949E">${a.time}</span>
<span class="sf-mono" style="font-size: 11px; color: #E6EDF3; margin-left: auto">${a.conf}</span>
</span>
<span style="display: block; font-size: 13px; color: #E6EDF3; margin-top: 4px">${a.typeName}<span class="sf-mono" style=${`font-size: 10px; color: ${a.color}`}>${a.live}</span><span class="sf-mono" style="font-size: 10px; color: #8B949E">${a.truth}</span></span>
<span class="sf-mono" style="display: block; font-size: 11px; color: #8B949E; margin-top: 2px">${a.ev}</span>
</button>`)}
</div>
</div>
<div style="background: linear-gradient(180deg, #151C26 0%, #121821 100%); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,0.28); padding: 16px 18px">
<h2 class="sf-h2" style="margin: 0 0 8px">FAILURE MODE → PART</h2>
${v.modes.map((m) => html`
<div style=${`display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid ${m.border}; background: ${m.bg}; border-radius: 8px; margin-bottom: 6px`}>
<span class="sf-mono" style=${`font-size: 11px; font-weight: 700; color: ${m.color}; width: 34px`}>${m.code}</span>
<span style="font-size: 12px; color: #E6EDF3; flex: 1">${m.name}<span style="color: #8B949E"> → ${m.part}</span></span>
<span class="sf-mono" style="font-size: 10px; color: #8B949E">${m.count}×</span>
<span class="sf-mono" style=${`font-size: 10px; font-weight: 700; color: ${m.color}; width: 34px; text-align: right`}>${m.state}</span>
</div>`)}
<div style="font-size: 11px; color: #8B949E; margin-top: 4px">${v.modeNote}</div>
</div>
</section>
</div>

<section aria-label="Timeline replay" style="margin-top: 16px; background: linear-gradient(180deg, #151C26 0%, #121821 100%); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,0.28); padding: 16px 18px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 10px">
<button type="button" class="sf-btn" onClick=${v.togglePlay} aria-label=${v.playLabel} style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #E6EDF3; cursor: pointer">
${v.playing && html`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>`}
${v.paused && html`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>`}
</button>
<div role="group" aria-label="Playback speed" style="display: flex; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden">
${v.speeds.map((b) => html`
<button type="button" class="sf-btn sf-mono" aria-pressed=${String(b.pressed)} onClick=${b.pick} style=${`min-width: 44px; height: 44px; border: 0; background: ${b.bg}; color: ${b.fg}; font-size: 12px; font-weight: 600; cursor: pointer`}>${b.label}</button>`)}
</div>
<button type="button" class="sf-btn sf-mono" onClick=${v.nextFault} style="height: 44px; padding: 0 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #E6EDF3; font-size: 12px; cursor: pointer">NEXT FAULT ›</button>
<span class="sf-mono" style="font-size: 13px; color: #E6EDF3">${v.clock}</span>
<span class="sf-mono" style="font-size: 12px; color: #8B949E">t = ${v.tPad}</span>
<span class="sf-mono" style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: #8B949E">
<span><span style="color: #EF4444">■</span> HIGH zone</span>
<span><span style="color: #F59E0B">■</span> MED zone</span>
<span><span style="color: #06B6D4">━</span> fault_probability</span>
</span>
</div>
<svg viewBox="0 0 1000 120" preserveAspectRatio="none" style="width: 100%; height: 120px; display: block; background: rgba(0,0,0,0.25); border-radius: 10px" role="img" aria-label="Fault probability over the replay, with predicted fault zones shaded">
<path d=${v.zoneMed} fill="#F59E0B" fill-opacity="0.22"></path>
<path d=${v.zoneHigh} fill="#EF4444" fill-opacity="0.26"></path>
<line x1="0" x2="1000" y1=${v.medY} y2=${v.medY} stroke="#F59E0B" stroke-opacity="0.6" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></line>
<line x1="0" x2="1000" y1=${v.hiY} y2=${v.hiY} stroke="#EF4444" stroke-opacity="0.6" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></line>
<path d=${v.probArea} fill="#06B6D4" fill-opacity="0.12"></path>
<path d=${v.probLine} fill="none" stroke="#06B6D4" stroke-width="1.5" vector-effect="non-scaling-stroke"></path>
<rect x=${v.cursorX} y="0" width=${v.futureW} height="120" fill="#0D1117" fill-opacity="0.6"></rect>
<line x1=${v.cursorX} x2=${v.cursorX} y1="0" y2="120" stroke="#E6EDF3" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
</svg>
<input class="sf-range" type="range" min="0" max=${v.maxT} step="1" value=${v.t} onInput=${v.onScrub} aria-label="Replay position" />
<div class="sf-mono" style="display: flex; justify-content: space-between; font-size: 10px; color: #6E7681">
${v.axis.map((a) => html`<span>${a}</span>`)}
</div>
</section>

</div>
</div>`;
  }
}

render(html`<${App} ...${window.SF.props} />`, document.getElementById('root'));
</script>
</body>
</html>
